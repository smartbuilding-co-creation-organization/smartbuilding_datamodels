name: build-validate-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Generate artifacts and validate RDF
        run: make validate

      - name: Build documentation
        run: .venv/bin/mkdocs build --strict --site-dir site

      - name: Verify generated JSON Schema and docs are committed
        run: git diff --exit-code -- output/building_model.schema.json docs

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push'
    needs: build-validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-documents-sync:
    if: github.event_name == 'push'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Notify smartbuilding_documents to sync reference docs
        env:
          DOCS_SYNC_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
        run: |
          if [ -z "${DOCS_SYNC_TOKEN}" ]; then
            echo "::warning::DOCS_SYNC_TOKEN is not set — skipping smartbuilding_documents sync notification."
            exit 0
          fi
          curl -sS --fail -X POST \
            -H "Authorization: Bearer ${DOCS_SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/smartbuilding-co-creation-organization/smartbuilding_documents/dispatches \
            -d '{"event_type":"datamodels-docs-updated"}'
