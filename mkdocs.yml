site_name: Smart Building Ontology (LinkML)
site_url: https://smartbuilding-co-creation-organization.github.io/smartbuiding_datamodels/
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smartbuilding-co-creation-organization/smartbuiding_datamodels
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10.6.1/dist/mermaid.min.js
