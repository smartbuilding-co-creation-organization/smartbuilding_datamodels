site_name: Smart Building Ontology (LinkML)
site_url: https://smartbuilding-co-creation-organization.github.io/smartbuilding_datamodels/
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - ガイド:
    # BEGIN documents-guide-generated
    - スマートビルとは: guide/getting_started.md
    - ウォークスルー: guide/walkthrough.md
    - 学習ロードマップ: guide/learning_roadmap.md
    - 用語集: guide/glossary.md
    - データフロー: guide/smart_building_data_flow.md
    - ポイントリスト定義: guide/pointlist.md
    - ポイントリスト サンプル: guide/pointlist_sample.md
    - オントロジー調査: guide/smart_building_ontology_survey.md
# END documents-guide-generated
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smartbuilding-co-creation-organization/smartbuilding_datamodels
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - tables
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
